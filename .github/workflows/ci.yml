name: CrickVision CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q crickvision tests
      - run: python -m pytest -q
      - run: crickvision --help
      - run: crickvision-manifest --help
      - run: crickvision-benchmark --help
      - run: crickvision-export --help\n      - run: crickvision-train-detector --help
