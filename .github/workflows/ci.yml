name: CrickVision CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: crickvision-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: Install CPU-only PyTorch wheels
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - run: python -m pip install -e ".[dev]"
      - run: ruff check --select E4,E7,E9,F crickvision tests
      - run: python -m compileall -q crickvision tests
      - run: python -m pytest -q
      - run: crickvision --help
      - run: crickvision-manifest --help
      - run: crickvision-benchmark --help
      - run: crickvision-export --help
      - run: crickvision-train-detector --help
      - run: python -m crickvision.cli --help
