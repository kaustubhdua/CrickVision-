name: Build release artifacts

on:
  pull_request:
    branches: [main]
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ".[dev]"
      - run: ruff check --select E4,E7,E9,F crickvision tests
      - run: python -m compileall -q crickvision tests
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: crickvision --help
      - run: crickvision-manifest --help
      - run: crickvision-benchmark --help
      - run: crickvision-export --help
      - run: crickvision-train-detector --help
      - run: crickvision-sample-frames --help
      - run: crickvision-validate-samples --help
      - uses: actions/upload-artifact@v4
        with:
          name: crickvision-python-distributions
          path: dist/
          if-no-files-found: error
