[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crickvision"
version = "0.3.0"
description = "Local-first computer vision toolkit for cricket video analysis"
license = "MIT"
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "torchvision>=0.17", "opencv-python-headless>=4.9", "Pillow>=10.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]
dashboard = ["streamlit>=1.35"]

[project.scripts]
crickvision = "crickvision.cli:main"
crickvision-manifest = "crickvision.manifest:main"
crickvision-benchmark = "crickvision.benchmark:main"
crickvision-export = "crickvision.export:main"
crickvision-train-detector = "crickvision.train_detector:main"

[tool.setuptools.packages.find]
include = ["crickvision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
